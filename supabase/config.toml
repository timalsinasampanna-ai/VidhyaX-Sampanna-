# Vidhya X Supabase Configuration File
project_id = "vidhya-x"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://*"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "52428800" # 50MiB
